[package]
name = "llx"
description = "An ultrafast, lightweight agent runtime for coding and CI, and a minimal agent for the terminal"
homepage = "https://llx.sh"
repository = "https://github.com/rsaryev/llx"
keywords = ["agent", "agent-runtime", "coding-agent", "cli", "llm"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "llx"
path = "src/main.rs"

# The composition root (rule L4): the only package that depends on tools, providers and stores.
[dependencies]
agent.workspace = true
contracts.workspace = true
protocol.workspace = true
client.workspace = true
queue.workspace = true
openai.workspace = true
models.workspace = true
openrouter.workspace = true
provider-kit.workspace = true
session.workspace = true
tools.workspace = true
clap.workspace = true
serde_json.workspace = true
log.workspace = true
crossterm.workspace = true
pulldown-cmark.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
# Signals, the terminal's pending input and its echo: calls std has no wrapper for.
libc.workspace = true

[dev-dependencies]
insta.workspace = true
vt100.workspace = true

[lints]
workspace = true
