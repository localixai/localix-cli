# llx: an ultrafast, lightweight coding agent for the terminal: read, edit, bash,
# and a native browser whose clicks and typing a decision model does.
#
# Packages and apps, dependencies pointing inward only (AGENTS.md, rules L1-L5):
#   packages/contracts      ports only: chat model, tools, gate, view, decision model, hands, history
#   packages/agent          the agent: a chat model's loop over tools
#   packages/decision-loop  the browser's hands: a task carried out on a view with a decision model
#   packages/tools          the tools: read, edit, bash, the workspace, a native browser window
#   packages/providers/     the models' providers, a package each, and the kit they share:
#     kit                   no port: HTTP, PKCE, the sign-in callback, credential files, SSE
#     openrouter            OpenRouter's chat and decision models, its key
#     openai                OpenAI's models through a ChatGPT sign-in (the Responses API)
#     models                the model catalog: a TOML database built in, models.dev on top
#   packages/session        a history store: sessions as JSON files
#   apps/cli                the `llx` binary: composes the packages
[workspace]
resolver = "3"
members = [
    "packages/agent",
    "packages/contracts",
    "packages/decision-loop",
    "packages/session",
    "packages/tools",
    "packages/providers/*",
    "apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
agent = { path = "packages/agent" }
contracts = { path = "packages/contracts" }
decision-loop = { path = "packages/decision-loop" }
models = { path = "packages/providers/models" }
openai = { path = "packages/providers/openai" }
openrouter = { path = "packages/providers/openrouter" }
provider-kit = { path = "packages/providers/kit" }
session = { path = "packages/session" }
tools = { path = "packages/tools" }
base64 = "0.23.1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
getrandom = "0.3"
# Already in the tree through tao and wry: the few unix calls std has no wrapper for.
libc = "0.2"
# The terminal UI: crossterm and ratatui, with only the features it uses.
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "scrolling-regions", "unstable-backend-writer"] }
textwrap = "0.16.2"
unicode-width = "0.2"
# Tests of what the terminal shows (dev only): snapshots. A terminal emulator: what the tests draw
# into, and a terminal session's screen in its window.
insta = "1.46"
vt100 = "0.16.2"
objc2 = "0.6"
# Already in the tree through tao and wry: the completion block of a WebKit screenshot.
block2 = "0.6"
# Already in the tree through wry: the configuration the browser's tabs share.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37"
ureq = { version = "3", default-features = false, features = ["json", "gzip", "native-tls"] }
wry = "0.57"

# A small, self-contained binary: the browser engine is the system's own WebView, TLS is the OS's,
# and the code is optimized for size ("z"): the time goes to the network and the model, not here.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
