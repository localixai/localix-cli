# llx: an ultrafast, lightweight agent runtime: read, edit, bash,
# and a native browser whose clicks and typing a decision model does.
#
# Packages and apps, dependencies pointing inward only (AGENTS.md, rules L1-L5):
#   packages/contracts      ports only: chat model, tools, gate, view, decision model, hands, history
#   packages/agent          the agent: a chat model's loop over tools
#   packages/decision-loop  the browser's hands: a task carried out on a view with a decision model
#   packages/tools          the tools: read, edit, bash, the workspace, a native browser window
#   packages/providers/     the models' providers, a package each, and the kit they share:
#     kit                   no port: HTTP, PKCE, the sign-in callback, credential files, SSE
#     openrouter            OpenRouter's chat and decision models, its key
#     openai                OpenAI's models through a ChatGPT sign-in (the Responses API)
#     models                the model catalog: a TOML database built in, models.dev on top
#   packages/client         the interface's side of the seam: one client, in process or over a socket
#   packages/protocol       what the interface and the server say to each other: wire types only
#   packages/queue          one queue for what reaches a run from outside its calls, each entry
#                           with its own policy (agents' answers, monitors, the window, ...)
#   packages/session        a history store: sessions as JSON files
#   apps/cli                the `llx` binary: composes the packages
[workspace]
resolver = "3"
members = [
    "packages/agent",
    "packages/client",
    "packages/contracts",
    "packages/decision-loop",
    "packages/protocol",
    "packages/queue",
    "packages/session",
    "packages/tools",
    "packages/providers/*",
    "apps/*",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

# The workspace's lints, taken by every crate (ARCHITECTURE.md S4). Hard: a lint is set aside only
# in place, by an `expect` with its `reason`, never turned off here. Tests may unwrap, panic and
# print (clippy.toml); working code may not.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
# The tightest visibility that compiles (L9): `pub` only for what another crate uses.
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
# A panic is a bug (R4): no unwrap, expect, panic or unreachable in working code; an error is
# handled, returned or shown.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
# A string sliced inside a character panics.
string_slice = "deny"
# A number cut short by `as` is a silent bug: `try_from`, or a reason.
cast_possible_truncation = "deny"
# What reaches the terminal goes through the interface and the output; the process ends in
# `main.rs` only, with the exit-code contract (K6).
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
# Shared state is Mutex or atomics (R2); the rest of the banned API is in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"
# Small functions, as small files (S1): at most 100 lines, a bounded complexity.
too_many_lines = "deny"
cognitive_complexity = "deny"
# Explicit where it matters.
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
match_wildcard_for_single_variants = "deny"
wildcard_imports = "deny"
unused_self = "deny"
# Rust's anti-patterns (ARCHITECTURE.md R6-R10, P4-P6, S11): a lost error cause, a guard held
# where it blocks, time that underflows, a cast that changes sign, flags instead of a state.
map_err_ignore = "deny"
unwrap_in_result = "deny"
unused_result_ok = "deny"
significant_drop_in_scrutinee = "deny"
unchecked_time_subtraction = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
option_option = "deny"
unnecessary_wraps = "deny"
needless_collect = "deny"
format_collect = "deny"
iter_over_hash_type = "deny"
fallible_impl_from = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
rc_buffer = "deny"
try_err = "deny"
get_unwrap = "deny"
verbose_file_reads = "deny"
lossy_float_literal = "deny"
mixed_read_write_in_expression = "deny"
infinite_loop = "deny"
empty_drop = "deny"
error_impl_error = "deny"
panic_in_result_fn = "deny"
rest_pat_in_fully_bound_structs = "deny"
trivially_copy_pass_by_ref = "deny"
large_types_passed_by_value = "deny"
inefficient_to_string = "deny"
implicit_clone = "deny"
create_dir = "deny"
filetype_is_file = "deny"
# Every unsafe block says why it is sound, one operation each (S11).
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# A lint set aside says why, and is an `expect`: an exemption that no longer applies fails the
# build, so none outlives its reason.
allow_attributes_without_reason = "deny"
allow_attributes = "deny"

[workspace.dependencies]
agent = { path = "packages/agent" }
client = { path = "packages/client" }
contracts = { path = "packages/contracts" }
decision-loop = { path = "packages/decision-loop" }
protocol = { path = "packages/protocol" }
models = { path = "packages/providers/models" }
openai = { path = "packages/providers/openai" }
openrouter = { path = "packages/providers/openrouter" }
queue = { path = "packages/queue" }
provider-kit = { path = "packages/providers/kit" }
session = { path = "packages/session" }
# Without default features: the app chooses the browser through its own `browser` feature (A8).
tools = { path = "packages/tools", default-features = false }
base64 = "0.23.1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
# The one native-tls (through ureq) builds: one copy in the tree.
getrandom = "0.4"
# Already in the tree through tao and wry: the few unix calls std has no wrapper for.
libc = "0.2"
# The terminal UI: crossterm and ratatui, with only the features it uses.
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "scrolling-regions", "unstable-backend-writer"] }
unicode-width = "0.2"
# Tests of what the terminal shows (dev only): snapshots. A terminal emulator: what the tests draw
# into, and a terminal session's screen in its window.
insta = "1.46"
vt100 = "0.16.2"
objc2 = "0.6"
# Already in the tree through tao and wry: the completion block of a WebKit screenshot.
block2 = "0.6"
# Already in the tree through wry: the configuration the browser's tabs share.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKWebViewConfiguration"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Already in the tree through ureq's gzip: the built-in model catalog, kept deflated.
miniz_oxide = "0.9.1"
sha2 = "0.11.1"
gtk = "0.18"
tao = "0.37"
ureq = { version = "3", default-features = false, features = ["json", "gzip", "native-tls"] }
wry = "0.57"

# A small, self-contained binary: the browser engine is the system's own WebView, TLS is the OS's,
# and the code is optimized for size ("z"): the time goes to the network and the model, not here.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
# A panic unwinds: the daemon serves many terminals, and one command's panic must end only that
# command (ARCHITECTURE.md W8), not every session in the process.
panic = "unwind"
strip = true
