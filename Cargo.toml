# lx, the Localix CLI: an ultrafast, lightweight coding agent for the terminal: read, edit, bash,
# and a native browser whose clicks and typing a decision model does.
#
# Packages and apps, dependencies pointing inward only (AGENTS.md, rules L1-L5):
#   packages/contracts      ports only: chat model, tools, gate, view, decision model, hands, history
#   packages/agent          the agent: a chat model's loop over tools
#   packages/decision-loop  the browser's hands: a task carried out on a view with a decision model
#   packages/tools          the tools: read, edit, bash, the workspace, a native browser window
#   packages/openrouter     the models' provider: OpenRouter's chat and decision models, sign-in
#   packages/session        a history store: sessions as JSON files
#   apps/cli                the `lx` binary: composes the packages
[workspace]
resolver = "3"
members = ["packages/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
agent = { path = "packages/agent" }
contracts = { path = "packages/contracts" }
decision-loop = { path = "packages/decision-loop" }
openrouter = { path = "packages/openrouter" }
session = { path = "packages/session" }
tools = { path = "packages/tools" }
base64 = "0.23.1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
getrandom = "0.3"
# Already in the tree through tao and wry: the few unix calls std has no wrapper for.
libc = "0.2"
objc2 = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37"
ureq = { version = "3", default-features = false, features = ["json", "gzip", "native-tls"] }
wry = "0.57"

# A small, self-contained binary: the browser engine is the system's own WebView, TLS is the OS's,
# and the code is optimized for size ("z"): the time goes to the network and the model, not here.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = true
