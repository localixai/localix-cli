[package]
name = "tools"
description = "The tools the decision loop drives: a native browser window"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[test]]
name = "browser"
harness = false

# The tool protocol only (rule L3): a tool knows nothing of the loop or the model.
[dependencies]
agent.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tao.workspace = true
wry.workspace = true

# Already in the tree through wry: messages and blocks to the WKWebView behind the window.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
