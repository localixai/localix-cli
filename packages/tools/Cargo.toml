[package]
name = "tools"
description = "The agent's tools: files read and edited, shell commands, a native browser window, questions to the person"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[test]]
name = "browser"
harness = false

# The tool protocol only (rule L3): a tool knows nothing of the loop or the model.
[dependencies]
contracts.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tao.workspace = true
wry.workspace = true

# A command's own session and the kill of its process group (setsid, kill), and a terminal of its
# own for a session (openpty, TIOCSCTTY, poll, waitid).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Already in the tree through wry: messages to the WKWebView behind the window.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
