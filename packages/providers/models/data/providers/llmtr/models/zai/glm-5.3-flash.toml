# Sources (accessed 2026-11-27): https://llmtr.com/models and GET https://llmtr.com/v1/models
# Pricing: $0.135/M input, $0.45/M output, $0.027/M cache read. Context 1,000,000, max output 131,072.
# Effort: low|high|max (reasoning is on).
schema = 2
base_model = "zhipuai/glm-5.3-flash"

[capabilities]
reasoning = { supported = true, effort = ["low", "high", "max"] }

[limit]
context = 1_000_000
output = 131_072

[api.chat-completions]

[cost.text.input]
price = 0.135
cache = { read = 0.027 }

[cost.text.output]
price = 0.45
