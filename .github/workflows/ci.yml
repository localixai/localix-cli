name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to a commit: a moved tag or branch cannot change what runs.
#
# A new push to a pull request supersedes its running checks; on main every commit keeps its own
# run, so a red commit is never hidden by the one after it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # the stable branch, 2026-10-01
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The install and release scripts run on machines we never see: keep them portable.
      - run: shellcheck scripts/*.sh

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
        with:
          extra: xvfb
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # the stable branch, 2026-10-01
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The lint job sees only Linux code; the macOS and Windows modules compile only here.
      - name: Clippy (platform code)
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked
      # packages/tools/tests/browser.rs opens a real WebView window, which needs a display.
      - name: Test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
        with:
          extra: xvfb
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # the stable branch, 2026-10-01
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Prebuilt binaries from each project's own releases, at a fixed version: no third-party
      # action to pin, and no newer release changes what runs.
      - name: Install cargo-nextest and cargo-llvm-cov
        shell: bash
        run: |
          bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          curl -LsSf https://get.nexte.st/0.9.149/linux | tar zxf - -C "$bin"
          curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz \
            | tar zxf - -C "$bin"
      # Every test under nextest, instrumented; fails under 80% of lines.
      - run: xvfb-run -a scripts/coverage.sh --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      # The version comes from the workspace's rust-version, so Cargo.toml stays the one place it
      # is written. `cargo +VERSION` overrides rust-toolchain.toml.
      - name: Install the minimum supported Rust
        id: msrv
        shell: bash
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$msrv" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}
      # The tests too: a test on a newer std API would otherwise break `cargo test` on the MSRV.
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --locked

  size:
    name: size
    runs-on: ubuntu-latest
    env:
      # 2.5 MiB. The binary is about 1.6 MB: a jump past this means a dependency that has not
      # earned its size (AGENTS.md).
      LIMIT_BYTES: 2621440
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # the stable branch, 2026-10-01
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release --locked
      - name: Check the binary size
        shell: bash
        run: |
          size=$(wc -c < target/release/llx | tr -d ' ')
          kib=$((size / 1024))
          limit_kib=$((LIMIT_BYTES / 1024))
          {
            echo "### Release binary"
            echo
            echo "| binary | size | limit |"
            echo "| --- | --- | --- |"
            echo "| \`llx\` (x86_64-unknown-linux-gnu) | $size bytes ($kib KiB) | $limit_kib KiB |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "llx: $size bytes (limit $LIMIT_BYTES)"
          if [ "$size" -gt "$LIMIT_BYTES" ]; then
            echo "::error::target/release/llx is $kib KiB, over the $limit_kib KiB limit"
            exit 1
          fi
