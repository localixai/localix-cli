# The workspace's lints are in Cargo.toml; this is their configuration (ARCHITECTURE.md S4).

# Tests may unwrap, panic, print and index: a failed test is the panic's job (R4).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
allow-indexing-slicing-in-tests = true

too-many-lines-threshold = 100
cognitive-complexity-threshold = 25

disallowed-methods = [
    { path = "std::process::exit", reason = "the process ends in main.rs, with the exit-code contract (exit.rs)" },
    { path = "std::env::set_var", reason = "the environment is the session's: pass the value instead" },
    { path = "std::env::remove_var", reason = "the environment is the session's: pass the value instead" },
]
disallowed-types = [
    { path = "std::cell::RefCell", reason = "state shared across threads is a Mutex or an atomic (R2)" },
    { path = "std::cell::Cell", reason = "state shared across threads is a Mutex or an atomic (R2)" },
    { path = "std::rc::Rc", reason = "ports are Send + Sync (R2): Arc" },
]
