[package]
name = "llx"
description = "llx: an ultrafast, lightweight coding agent for the terminal: read, edit, bash, a browser and ask"
homepage = "https://llx.sh"
repository = "https://github.com/rsaryev/llx"
keywords = ["agent", "coding-agent", "cli", "llm", "browser"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "llx"
path = "src/main.rs"

# The composition root (rule L4): the only package that depends on tools, providers and stores.
[dependencies]
base64.workspace = true
agent.workspace = true
contracts.workspace = true
decision-loop.workspace = true
openai.workspace = true
models.workspace = true
openrouter.workspace = true
provider-kit.workspace = true
session.workspace = true
tools.workspace = true
clap.workspace = true
serde_json.workspace = true
crossterm.workspace = true
pulldown-cmark.workspace = true
ratatui.workspace = true
textwrap.workspace = true
unicode-width.workspace = true

[dev-dependencies]
insta.workspace = true
vt100.workspace = true

# Signals, the terminal's pending input and its echo: calls std has no wrapper for.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
