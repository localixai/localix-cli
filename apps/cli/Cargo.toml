[package]
name = "llx"
description = "The agent runtime other agents build on: a window of browser pages and terminals any agent can work in, helpers on any model, decisions for scripts and CI, and a minimal agent for the terminal"
homepage = "https://llx.sh"
repository = "https://github.com/rsaryev/llx"
keywords = ["agent", "agent-runtime", "coding-agent", "cli", "llm"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "llx"
path = "src/main.rs"

[features]
default = ["browser"]
# The browser window and its engine; off, the headless build (for CI and servers) has terminal
# tabs only and links no WebView (ARCHITECTURE.md A8).
browser = ["tools/browser"]

# The composition root (rule L4): the only package that depends on tools, providers and stores.
[dependencies]
base64.workspace = true
agent.workspace = true
contracts.workspace = true
protocol.workspace = true
client.workspace = true
queue.workspace = true
decision-loop.workspace = true
openai.workspace = true
models.workspace = true
openrouter.workspace = true
provider-kit.workspace = true
session.workspace = true
tools.workspace = true
clap.workspace = true
serde_json.workspace = true
log.workspace = true
# xterm.js, fetched once for the terminal windows, is checked against its pinned SHA-384.
sha2.workspace = true
crossterm.workspace = true
pulldown-cmark.workspace = true
ratatui.workspace = true
unicode-width.workspace = true

[dev-dependencies]
insta.workspace = true
vt100.workspace = true

# Signals, the terminal's pending input and its echo: calls std has no wrapper for.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
