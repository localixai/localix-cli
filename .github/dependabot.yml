version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release waits a week before it is proposed: time for a bad one to be yanked.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Minor and patch updates in one pull request; a major one comes alone, since it may need code.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
