[package]
name = "cli"
description = "lxsurf: a fast, small coding agent for the terminal: read, edit, bash and a browser"
keywords = ["agent", "coding-agent", "cli", "llm", "browser"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lxsurf"
path = "src/main.rs"

# The composition root (rule L4): the only package that depends on tools, providers and stores.
[dependencies]
agent.workspace = true
contracts.workspace = true
decision-loop.workspace = true
openrouter.workspace = true
session.workspace = true
tools.workspace = true
clap.workspace = true
serde_json.workspace = true

# Signals, the terminal's pending input and its echo: calls std has no wrapper for.
[target.'cfg(unix)'.dependencies]
libc.workspace = true
