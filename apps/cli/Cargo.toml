[package]
name = "cli"
description = "lxsurf: a goal in, an agent surfs a native browser window there and answers"
keywords = ["agent", "browser", "decision-model", "automation", "e2e"]
categories = ["command-line-utilities", "development-tools::testing"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lxsurf"
path = "src/main.rs"

# The composition root (rule L4): the only package that depends on tools, providers and stores.
[dependencies]
agent.workspace = true
contracts.workspace = true
decision-loop.workspace = true
openrouter.workspace = true
session.workspace = true
tools.workspace = true
clap.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
