name: Bug report
description: llx did something wrong, crashed, or would not build.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `llx --version`.
      placeholder: llx 0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture, and how llx was installed.
      placeholder: macOS 15 arm64, install.sh
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The exact command or goal. Remove keys and anything private.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: >-
        The terminal output, ideally with `--trace` or `DECISION_LOOP_DEBUG=1` (and `BROWSER_DEBUG=1`
        for page timing). `llx doctor` helps with setup problems.
      render: text
