name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Third-party actions are pinned to a commit: a moved tag or branch cannot change what runs.
#
# A new push to a pull request supersedes its running checks; on main every commit keeps its own
# run, so a red commit is never hidden by the one after it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A fresh runner gains nothing from debug info or incremental state: both only slow the build.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  # One job, so the dependencies compile once: format, lint, then the tests on a virtual display
  # (packages/tools/tests/browser.rs opens a real WebView window). Linux only: a macOS runner
  # costs ten times as much, and the release workflow tests both. Coverage, the MSRV and the
  # binary's size are checked by hand (`scripts/coverage.sh`, `cargo +1.88 check`, RELEASING.md).
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
        with:
          extra: xvfb
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # the stable branch, 2026-10-01
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" cargo test --workspace --locked
      - run: shellcheck scripts/*.sh
