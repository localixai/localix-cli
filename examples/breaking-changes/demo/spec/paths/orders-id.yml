get:
  operationId: getOrder
  summary: Receive an order by id
  parameters:
    - name: orderId
      in: path
      required: true
      schema:
        type: integer
  responses:
    "200":
      description: The order
      content:
        application/json:
          schema:
            $ref: "../schemas/Order.yml"

put:
  operationId: updateOrder
  summary: Update an order by id
  parameters:
    - name: orderId
      in: path
      required: true
      schema:
        type: integer
  requestBody:
    content:
      application/json:
        schema:
          $ref: "../schemas/UpdateOrder.yml"
  responses:
    "200":
      description: Order updated
      content:
        application/json:
          schema:
            type: object
            required:
              - ok
            properties:
              ok:
                type: boolean
