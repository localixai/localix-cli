<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lights out</title>
<link rel="stylesheet" href="kit.css">
<style>
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 0.5rem;
    padding: 0.75rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-panel);
  }
  .board:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
  }
  .cell {
    border-radius: var(--radius-control);
    background: var(--sunk);
    cursor: pointer;
    transition: background 0.12s, box-shadow 0.12s;
  }
  .cell.on {
    background: var(--accent);
    box-shadow: 0 0 18px -4px var(--accent);
  }
  .board:focus .cell.at {
    outline: 3px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<main class="arcade">
  <h1>Lights out</h1>
  <p class="lead">Turn every light off. A press flips a light and the four beside it.</p>
  <div class="stats" aria-live="polite">
    <div class="stat"><span>Puzzle</span><strong id="puzzle">1</strong></div>
    <div class="stat"><span>Lights on</span><strong id="left">0</strong></div>
    <div class="stat"><span>Moves</span><strong id="moves">0</strong></div>
  </div>
  <div class="stage"><div class="square">
    <div class="board" id="board" tabindex="0" role="grid" aria-label="Lights, 5 by 5"></div>
    <div class="over" id="won" hidden>
      <span id="won-text"></span>
      <div><button type="button" class="primary" id="next-won">Next puzzle</button></div>
    </div>
  </div></div>
  <div class="row" style="justify-content: center">
    <button type="button" id="again">Start over</button>
    <button type="button" id="next">Next puzzle</button>
  </div>
  <p class="keys">Move with <kbd>←</kbd> <kbd>↑</kbd> <kbd>→</kbd> <kbd>↓</kbd>, press with <kbd>Space</kbd> or <kbd>Enter</kbd>, or click a light.</p>
</main>
<script src="kit.js"></script>
<script>
  header("Lights out");
  const SIZE = 5;
  const $ = (id) => document.getElementById(id);
  let lights = [];
  let at = 12;
  let moves = 0;
  let puzzle = 1;

  function flip(i) {
    const [r, c] = [Math.floor(i / SIZE), i % SIZE];
    for (const [dr, dc] of [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const [y, x] = [r + dr, c + dc];
      if (y >= 0 && y < SIZE && x >= 0 && x < SIZE) lights[y * SIZE + x] = !lights[y * SIZE + x];
    }
  }

  /** A puzzle made by pressing a dark board: always solvable, the same for the same number. */
  function start() {
    const random = seeded(puzzle * 977);
    lights = Array(SIZE * SIZE).fill(false);
    for (let n = 0; n < 4 + puzzle; n++) flip(Math.floor(random() * SIZE * SIZE));
    if (!lights.some(Boolean)) flip(12);
    moves = 0;
    at = 12;
    draw();
  }

  function draw() {
    $("board").innerHTML = lights
      .map((on, i) => `<div class="cell ${on ? "on" : ""} ${i === at ? "at" : ""}" role="gridcell" data-i="${i}"
          aria-label="Row ${Math.floor(i / SIZE) + 1}, column ${(i % SIZE) + 1}, ${on ? "on" : "off"}"></div>`)
      .join("");
    const left = lights.filter(Boolean).length;
    $("puzzle").textContent = puzzle;
    $("left").textContent = left;
    $("moves").textContent = moves;
    $("won").hidden = left > 0;
    $("won-text").textContent = `Solved in ${moves} ${moves === 1 ? "move" : "moves"}`;
  }

  function press(i) {
    if (!lights.some(Boolean)) return;
    flip(i);
    moves++;
    draw();
  }

  $("board").addEventListener("keydown", (event) => {
    const [r, c] = [Math.floor(at / SIZE), at % SIZE];
    const to = {
      ArrowUp: [Math.max(0, r - 1), c],
      ArrowDown: [Math.min(SIZE - 1, r + 1), c],
      ArrowLeft: [r, Math.max(0, c - 1)],
      ArrowRight: [r, Math.min(SIZE - 1, c + 1)],
    }[event.key];
    if (to) {
      event.preventDefault();
      at = to[0] * SIZE + to[1];
      draw();
    } else if (event.key === " " || event.key === "Enter") {
      event.preventDefault();
      press(at);
    }
  });
  $("board").addEventListener("click", (event) => {
    const cell = event.target.closest("[data-i]");
    if (!cell) return;
    at = Number(cell.dataset.i);
    press(at);
  });
  const next = () => {
    puzzle++;
    start();
    $("board").focus();
  };
  $("next").addEventListener("click", next);
  $("next-won").addEventListener("click", next);
  $("again").addEventListener("click", () => {
    start();
    $("board").focus();
  });

  start();
  $("board").focus();
</script>
</body>
</html>
